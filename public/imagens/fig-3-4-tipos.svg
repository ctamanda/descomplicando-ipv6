<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img">
<rect width="1000" height="400" fill="white"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#123C6B"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#123C6B"/></marker></defs>
<rect x="40" y="30" width="920" height="44" rx="8" fill="#EAF1FA" stroke="none" stroke-width="2"/>
<text x="60" y="53" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="800" fill="#123C6B" text-anchor="start" dominant-baseline="middle">2000::/3</text>
<text x="300" y="53" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#123C6B" text-anchor="start" dominant-baseline="middle">Global unicast</text>
<text x="560" y="53" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start" dominant-baseline="middle">o endereço público, roteável na Internet</text>
<rect x="40" y="82" width="920" height="44" rx="8" fill="#E8F5EC" stroke="none" stroke-width="2"/>
<text x="60" y="105" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="800" fill="#1b6b3a" text-anchor="start" dominant-baseline="middle">fc00::/7</text>
<text x="300" y="105" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1b6b3a" text-anchor="start" dominant-baseline="middle">Unique local (ULA)</text>
<text x="560" y="105" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start" dominant-baseline="middle">o "privado": vale só dentro da organização</text>
<rect x="40" y="134" width="920" height="44" rx="8" fill="#FFF6D6" stroke="none" stroke-width="2"/>
<text x="60" y="157" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="800" fill="#7a5a00" text-anchor="start" dominant-baseline="middle">fe80::/10</text>
<text x="300" y="157" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#7a5a00" text-anchor="start" dominant-baseline="middle">Link-local</text>
<text x="560" y="157" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start" dominant-baseline="middle">vale só no enlace; toda interface cria um</text>
<rect x="40" y="186" width="920" height="44" rx="8" fill="#FBE3E3" stroke="none" stroke-width="2"/>
<text x="60" y="209" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="800" fill="#9B1C1C" text-anchor="start" dominant-baseline="middle">ff00::/8</text>
<text x="300" y="209" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#9B1C1C" text-anchor="start" dominant-baseline="middle">Multicast</text>
<text x="560" y="209" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start" dominant-baseline="middle">grupo de interfaces (ff02::1, ff02::2)</text>
<rect x="40" y="238" width="920" height="44" rx="8" fill="#F3F4F6" stroke="none" stroke-width="2"/>
<text x="60" y="261" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="800" fill="#1F2937" text-anchor="start" dominant-baseline="middle">::1</text>
<text x="300" y="261" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="middle">Loopback</text>
<text x="560" y="261" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start" dominant-baseline="middle">o próprio dispositivo</text>
<rect x="40" y="290" width="920" height="44" rx="8" fill="#F3F4F6" stroke="none" stroke-width="2"/>
<text x="60" y="313" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="800" fill="#1F2937" text-anchor="start" dominant-baseline="middle">::</text>
<text x="300" y="313" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="middle">Não especificado</text>
<text x="560" y="313" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start" dominant-baseline="middle">"ainda não tenho endereço"</text>
<rect x="40" y="342" width="920" height="44" rx="8" fill="#F3F4F6" stroke="none" stroke-width="2"/>
<text x="60" y="365" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="800" fill="#1F2937" text-anchor="start" dominant-baseline="middle">2001:db8::/32</text>
<text x="300" y="365" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start" dominant-baseline="middle">Documentação</text>
<text x="560" y="365" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start" dominant-baseline="middle">só para exemplos, nunca atribuído</text>
</svg>
